# Added by `docker/bin/test` for the all and services modes: an OpenSSH server for the tests of flat\core\ssh (group `ssh`). Built from
# docker/sshd. Port 22 is the normal server, port 2222 refuses every session channel. The tests find their way in with the variables
# below and add their own client keys to the shared volume, which the server reads at each login. Fake credentials, local use only.
services:
  sshd:
    image: flat-tests-sshd
    build:
      context: sshd
    # a tiny init process, so that the processes the tests kill do not stay behind as zombies
    init: true
    volumes:
      - ssh-shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22 && nc -z 127.0.0.1 2222"]
      interval: 2s
      timeout: 5s
      retries: 30
  php:
    volumes:
      - ssh-shared:/shared
    environment:
      FLAT_TEST_SSH_HOST: sshd
      FLAT_TEST_SSH_PORT: "22"
      FLAT_TEST_SSH_NO_SESSIONS_PORT: "2222"
      FLAT_TEST_SSH_USER: flat
      FLAT_TEST_SSH_PASSWORD: flat-ssh-test-password
volumes:
  ssh-shared: {}
