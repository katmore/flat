services:
  php:
    image: ${FLAT_TEST_IMAGE:-flat-tests-php80}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    user: "${FLAT_TEST_UID:-1000}:${FLAT_TEST_GID:-1000}"
    volumes:
      - ..:/app
    environment:
      # Docker may inject host proxy settings. These services are on the internal
      # test network and must be reached directly, including by cURL/Guzzle.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},mongo,rabbitmq,anet-mock,sshd,s3mock
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},mongo,rabbitmq,anet-mock,sshd,s3mock
      # Xdebug develop caches exception argument objects, retaining SSH sessions.
      # Coverage mode preserves normal lifetimes; PHP still reports E_ALL.
      XDEBUG_MODE: coverage
      # bin/test runs in this container with the image's own PHPUnit install.
      FLAT_TEST_PHPUNIT: /opt/flat-test/tools/vendor/bin/phpunit
      FLAT_TEST_BOOTSTRAP: /opt/flat-test/bootstrap.php
      FLAT_TEST_MONGODB_URI: mongodb://mongo:27017
      FLAT_TEST_RABBITMQ_HOST: rabbitmq
  mongo:
    image: mongo:9.0@sha256:b0c835c26e5997413e985000f1013c275377cd9607761c1784d486f6dd620b7f
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.4-alpine@sha256:bba4266e0129b9e5c4b5eb985d8e488c77689eaf73399b34b5d176eb8a5d29e7
    environment:
      RABBITMQ_DEFAULT_USER: flatunit
      RABBITMQ_DEFAULT_PASS: flatunit-local-tests
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    healthcheck:
      # `ping` succeeds once the Erlang node is up, seconds before the AMQP
      # listener accepts connections; require the listener ports instead.
      # Run as the rabbitmq user: a root check that starts before the server
      # creates /var/lib/rabbitmq/.erlang.cookie leaves it owned by root, and
      # the server then fails to boot with "eacces" (the old startup flake).
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 2s
      timeout: 10s
      retries: 30

# Test services can reach one another; runtime containers have no Internet route.
networks:
  default:
    internal: true
