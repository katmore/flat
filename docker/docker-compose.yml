services:
  php:
    image: flat-tests-php73
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    user: "${FLAT_TEST_UID:-1000}:${FLAT_TEST_GID:-1000}"
    volumes:
      - ..:/app
    environment:
      # bin/test runs in this container with the image's own PHPUnit install.
      FLAT_TEST_PHPUNIT: /opt/flat-test/tools/vendor/bin/phpunit
      FLAT_TEST_BOOTSTRAP: /opt/flat-test/bootstrap.php
      FLAT_TEST_MONGODB_URI: mongodb://mongo:27017
      FLAT_TEST_RABBITMQ_HOST: rabbitmq
  mongo:
    image: mongo:5.0@sha256:41108d183e972dcbf98d09ed83f6cfc89a471a3f15d06f9d64a95e45d9db8dd2
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.8.34-alpine@sha256:711d76bc8d9822adf32fd9bdbe33f53645a77e2bbd0675f8011eed397919f7a4
    environment:
      RABBITMQ_DEFAULT_USER: flatunit
      RABBITMQ_DEFAULT_PASS: flatunit-local-tests
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    healthcheck:
      # `ping` succeeds once the Erlang node is up, seconds before the AMQP
      # listener accepts connections; require the listener ports instead.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 10s
      retries: 30

# Test services can reach one another; runtime containers have no Internet route.
networks:
  default:
    internal: true
