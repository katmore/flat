services:
  php:
    image: flat-tests-php72
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    user: "${FLAT_TEST_UID:-1000}:${FLAT_TEST_GID:-1000}"
    volumes:
      - ..:/app
    environment:
      FLAT_TEST_MONGODB_URI: mongodb://mongo:27017
      FLAT_TEST_RABBITMQ_HOST: rabbitmq
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  mongo:
    image: mongo:4.0@sha256:4ca81c89ad08f4cfa9906005126112bffe8fb363800466ef5e50f6238f6f6af1
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.8.34-alpine@sha256:711d76bc8d9822adf32fd9bdbe33f53645a77e2bbd0675f8011eed397919f7a4
    environment:
      RABBITMQ_DEFAULT_USER: flatunit
      RABBITMQ_DEFAULT_PASS: flatunit-local-tests
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 10s
      retries: 30
